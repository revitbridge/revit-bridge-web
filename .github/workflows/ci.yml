name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Test
        run: uv run pytest -q
      - name: Forbidden dependencies
        run: |
          if uv pip list | grep -iE "^(openai|anthropic|google-genai|cohere|chromadb) "; then
            echo "model SDK or vector store found in the environment" >&2
            exit 1
          fi
      - name: OpenAPI export is current
        run: |
          uv run python -c "from backend.main import create_app; import json; print(json.dumps(create_app().openapi(), indent=2))" > /tmp/api.json
          diff -u docs/api-v0.json /tmp/api.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t revit-bridge-web:ci .
      - name: Smoke
        run: |
          docker run -d --name web -p 7860:7860 revit-bridge-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/health
          curl -fsS http://127.0.0.1:7860/config.json
          test "$(curl -fsS http://127.0.0.1:7860/api/v1/bridge/tools | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" -ge 11
          curl -fsS http://127.0.0.1:7860/ | grep -q "<title>revit-bridge</title>"
          docker logs web
          docker rm -f web
