# Token bench tasks for the report step: a spec the model gets right, then an execution
# result that did not succeed, fed back instead of the run's fixture (execution: as the
# page would report it). Scored like the other tool tasks (the tool and its parameters);
# what they measure is the report step - with the roles, the supervisor, and the planner
# again each time the supervisor sends the task back (the host does at most twice; the
# bench reports the same result again each time, at most 3 reports per task).
# Fields: as in tasks.yml, plus execution: {success, ...} (an ExecutionResult).
- id: wall-validator-failed
  kind: tool
  message: "Create a wall on F2, 3000 mm high, from (0,0) to (6000,0). Use Basic Wall."
  expect:
    tool: create_wall
    params: {level_name: F2, height: 3000}
    max_turns: 3
  execution:
    success: false
    tool: create_wall
    error: validation_failed
    result: {Status: Success, ElementId: 424242, benchmark_fixture: true}
    validation:
      validator: element_count
      passed: false
      checks:
        - {name: count, passed: false, detail: "walls 12 -> 12, expected 13"}
    evidence_id: ev_benchmark_fixture_validation
    warnings: ["Synthetic benchmark feedback. No model operation was performed."]
- id: wall-refused
  kind: tool
  message: "Create a wall on F2, 3000 mm high, from (0,0) to (6000,0). Use Basic Wall."
  expect:
    tool: create_wall
    params: {level_name: F2, height: 3000}
    max_turns: 3
  # revit-bridge 0.9.1 and later mark a refused execution (nothing ran); 0.9.0 does not.
  execution:
    success: false
    tool: create_wall
    error: preconditions_failed
    refused: true
    preconditions_failed: ["the active document is read-only"]
    evidence_id: ev_benchmark_fixture_refused
    warnings: ["Synthetic benchmark feedback. No model operation was performed."]
