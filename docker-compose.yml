services:
  revit-bridge-web:
    build: .
    image: revit-bridge-web
    container_name: revit-bridge-web
    ports:
      # Loopback by default; a reverse proxy (nginx, Caddy, Cloudflare Tunnel)
      # terminates TLS. Set BIND_ADDRESS=0.0.0.0 to expose the port directly.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-7860}:7860"
    env_file:
      - path: .env
        required: false
    environment:
      # This host's files (skills, interaction logs) and the package's data
      # root (user capability packs, usage.json, evidence): the ./data volume.
      DATA_DIR: /app/data
      REVIT_BRIDGE_DATA_DIR: /app/data
      # Inside the container the app always listens on 7860; PORT in .env only
      # chooses the published host port above.
      PORT: 7860
      HOST: 0.0.0.0
      # How many paired add-ins may be connected at once. Their credentials are
      # created by the pairing flow and stored (hashed) in the data volume, so
      # there is no secret to mount.
      MAX_DEVICES: ${MAX_DEVICES:-20}
      # A local add-in on the Docker host is reachable as host.docker.internal.
      REVIT_BRIDGE_HOST: ${REVIT_BRIDGE_HOST:-host.docker.internal}
      REVIT_BRIDGE_PORT: ${REVIT_BRIDGE_PORT:-18080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    mem_limit: 1g
    restart: unless-stopped
